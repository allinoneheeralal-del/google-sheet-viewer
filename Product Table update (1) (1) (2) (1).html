<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>हमारे प्रोडक्ट्स</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}
.main-box{max-width:1000px;margin:8px auto;background:#fff;min-height:100vh;padding:16px;border-radius:15px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top-btn{border:0;border-radius:10px;padding:12px 18px;font-size:17px;color:#fff;font-weight:500;cursor:pointer;min-width:125px;box-shadow:0 2px 5px rgba(0,0,0,.15)}
.top-btn:active{transform:scale(.97)}
.wishlist-top{background:#ff1680}
.cart-top{background:#ff9800}
.reset-top{background:#f5262d}
.count-badge{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#555;font-weight:bold;min-width:32px;height:32px;border-radius:50%;margin-left:5px}
.page-title{text-align:center;font-size:31px;font-weight:bold;margin:10px 0 22px;color:#333}
.search-area{display:flex;gap:10px;margin-bottom:14px}
.search-box{position:relative;flex:1}
.search-box input{width:100%;height:65px;padding:10px 55px 10px 58px;border:2px solid #d1d1d1;border-radius:13px;font-size:22px;outline:none}
.search-box input:focus{border-color:#00a944}
.search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:30px;color:#555}
.clear-search{width:86px;border:0;border-radius:12px;background:#f5262d;color:#fff;font-size:34px;font-weight:bold;cursor:pointer}
.category-search{margin-bottom:18px}
.category-search select{width:100%;height:65px;padding:8px 45px 8px 18px;border:2px solid #d1d1d1;border-radius:13px;background:#fff;font-size:21px;outline:none}
.product-heading{background:#e4f7e9;color:#087b32;padding:17px 10px;border-radius:13px;text-align:center;font-size:25px;font-weight:bold;margin-bottom:12px}
.product-count{text-align:center;font-size:21px;color:#666;margin:14px 0 30px}
.table-wrapper{width:100%;overflow-x:auto}
.product-table{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}
.product-table th{background:#00ad45;color:#fff;border:1px solid #ddd;padding:12px 5px;font-size:18px;font-weight:bold}
.product-table td{border:1px solid #ddd;padding:12px 5px;font-size:18px;text-align:center;height:58px}
.product-table td.product-name{text-align:left;font-weight:500;word-break:break-word}
.product-table td.price{font-weight:bold;white-space:nowrap}
.product-table th:nth-child(1){width:11%}
.product-table th:nth-child(2){width:37%}
.product-table th:nth-child(3){width:19%}
.product-table th:nth-child(4){width:13%}
.product-table th:nth-child(5){width:20%}
.wishlist-btn{border:0;background:transparent;font-size:42px;line-height:1;cursor:pointer;padding:0}
.wishlist-btn.active{color:#ff1744}
.wishlist-btn:not(.active){color:#ddd;text-shadow:0 0 1px #888}
.add-cart-btn{border:0;background:#ff9800;color:#fff;border-radius:9px;padding:10px 11px;font-size:16px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.add-cart-btn.active{background:#00a944}
.add-cart-btn:active{transform:scale(.96)}
.no-result{display:none;text-align:center;padding:35px 10px;font-size:20px;color:#777}
.panel{display:none;padding:5px 0 20px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.panel-top h2{margin:0;font-size:25px}
.back-products{border:0;background:#00a944;color:#fff;padding:10px 14px;border-radius:8px;font-size:15px;cursor:pointer}
.panel-item{background:#fff;margin-bottom:10px;padding:13px;border-radius:10px;box-shadow:0 2px 7px rgba(0,0,0,.12);border:1px solid #eee}
.panel-item-name{font-weight:bold;font-size:18px}
.panel-item-price{margin-top:5px;font-size:17px}
.panel-actions{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.qty-btn{border:0;background:#ddd;padding:7px 13px;border-radius:6px;font-size:18px;cursor:pointer}
.remove-btn{border:0;background:#e00000;color:#fff;padding:8px 12px;border-radius:6px;font-size:14px;cursor:pointer}
.cart-add-btn{border:0;background:#ff9800;color:#fff;padding:8px 12px;border-radius:6px;font-size:14px;cursor:pointer}
.clear-wishlist-btn{border:0;background:#f5262d;color:#fff;padding:10px 14px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
.clear-wishlist-btn:active{transform:scale(.97)}

.whatsapp-wishlist-btn{
width:100%;
border:0;
background:#25D366;
color:#fff;
padding:14px;
border-radius:10px;
font-size:18px;
font-weight:bold;

margin-top:10px;

.cart-total{background:#1976d2;color:#fff;padding:15px;border-radius:10px;font-size:20px;font-weight:bold;margin-top:15px}

@media(max-width:600px){
.main-box{margin:8px 8px 0;padding:10px;border-radius:13px}
.top-buttons{gap:8px;flex-wrap:nowrap}
.top-btn{min-width:0;flex:1;padding:11px 7px;font-size:15px}
.count-badge{min-width:29px;height:29px}
.page-title{font-size:28px;margin:12px 0 20px}
.search-box input{height:62px;font-size:19px;padding-left:50px}

function loadStorage(key){
try{
const raw=window.localStorage.getItem(key);
if(!raw)return [];
const data=JSON.parse(raw);
return Array.isArray(data)?data:[];
}catch(e){
return [];
}
}

function safeSetStorage(key,value){
try{
window.localStorage.setItem(key,JSON.stringify(value));
}catch(e){
console.warn("Storage unavailable:",e);
}
}

function safeRemoveStorage(key){
try{
window.localStorage.removeItem(key);
}catch(e){
console.warn("Storage unavailable:",e);

/* =========================
   PRODUCT ID
========================= */

function productKey(product){
return [
product.category,
product.name,
Number(product.price)
].join("|||");
}

function itemKey(item){
return [
item.category,
item.name,
Number(item.price)
].join("|||");
}

/* =========================
   COUNTS
========================= */

function updateCounts(){
let cartQty=0;

cart.forEach(item=>{
cartQty+=Number(item.qty)||0;
});

const cartCount=document.getElementById("cartCount");
const wishlistCount=document.getElementById("wishlistCount");

if(cartCount)cartCount.textContent=cartQty;
if(wishlistCount)wishlistCount.textContent=wishlist.length;
}

/* =========================
   CATEGORY LIST
========================= */

function createCategoryList(){
const select=document.getElementById("categorySelect");
if(!select)return;

select.innerHTML='<option value="सभी">📦 सभी कैटेगरी</option>';

const categories=[];

allProducts.forEach(product=>{
if(!categories.includes(product.category)){
categories.push(product.category);
}
});

categories.forEach(name=>{
const option=document.createElement("option");
option.value=name;
option.textContent="📦 "+name;
select.appendChild(option);
});
}

/* =========================
   PRODUCT MATCH
========================= */

function isInWishlist(product){
return wishlist.some(item=>itemKey(item)===productKey(product));
}

function isInCart(product){
return cart.some(item=>itemKey(item)===productKey(product));
}

/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){
const tbody=document.getElementById("productBody");
const count=document.getElementById("productCount");
const noResult=document.getElementById("noResult");
const heading=document.getElementById("productHeading");

if(!tbody)return;

tbody.innerHTML="";

const search=currentSearch.toLocaleLowerCase("hi");
let serial=1;
let visibleProducts=[];

allProducts.forEach(product=>{
const categoryMatch=
currentCategory==="सभी"||
product.category===currentCategory;

const searchMatch=
String(product.name)
.toLocaleLowerCase("hi")
.includes(search);

if(categoryMatch&&searchMatch){
visibleProducts.push(product);
}
});

visibleProducts.forEach(product=>{

const tr=document.createElement("tr");

const td1=document.createElement("td");
td1.textContent=serial++;

const td2=document.createElement("td");
td2.className="product-name";
td2.textContent=product.name;

const td3=document.createElement("td");
td3.className="price";
td3.textContent="₹"+product.price;

const td4=document.createElement("td");

const wishButton=document.createElement("button");
wishButton.className=
"wishlist-btn"+
(isInWishlist(product)?" active":"");
wishButton.title="Wishlist";
wishButton.textContent=
isInWishlist(product)?"❤️":"♡";

wishButton.onclick=function(){
toggleWishlist(
product.name,
product.price,
product.category
);
};

td4.appendChild(wishButton);

const td5=document.createElement("td");

const cartButton=document.createElement("button");
cartButton.className=
"add-cart-btn"+
(isInCart(product)?" active":"");

cartButton.textContent=
isInCart(product)?"✓ कार्ट में":"🛒 जोड़ें";

cartButton.onclick=function(){
addToCart(
product.name,
product.price,
product.category
);
};

td5.appendChild(cartButton);

tr.appendChild(td1);
tr.appendChild(td2);
tr.appendChild(td3);
tr.appendChild(td4);
tr.appendChild(td5);

tbody.appendChild(tr);
});

if(count){
count.textContent=visibleProducts.length;
}

if(noResult){
noResult.style.display=
visibleProducts.length?"none":"block";
}

if(heading){
if(currentCategory==="सभी"){
heading.textContent="📦 सभी प्रोडक्ट";
}else{
heading.textContent="📦 "+currentCategory;
}
}
}

/* =========================
   CART
========================= */

function addToCart(productName,productPrice,productCategory){

const existing=cart.find(item=>
item.name===productName&&
Number(item.price)===Number(productPrice)&&
item.category===productCategory
);

if(existing){
existing.qty=(Number(existing.qty)||0)+1;
}else{
cart.push({
name:String(productName),
price:Number(productPrice)||0,
category:String(productCategory),
qty:1
});
}

saveCart();
renderProducts();
renderCart();
}

function saveCart(){
safeSetStorage("product_cart",cart);
updateCounts();
}

function removeCart(index){
if(index<0||index>=cart.length)return;

cart.splice(index,1);
saveCart();
renderCart();
renderProducts();
}

function increaseQty(index){
if(!cart[index])return;

cart[index].qty=
(Number(cart[index].qty)||0)+1;

saveCart();
renderCart();
renderProducts();
}

function decreaseQty(index){
if(!cart[index])return;

if(Number(cart[index].qty)>1){
cart[index].qty=
Number(cart[index].qty)-1;
}else{
cart.splice(index,1);
}

saveCart();
renderCart();
renderProducts();
}

function calculateCartTotal(){
return cart.reduce((total,item)=>{
return total+
(Number(item.price)||0)*
(Number(item.qty)||0);
},0);
}

/* =========================
   RENDER CART
========================= */

function renderCart(){
const list=document.getElementById("cartList");
const total=document.getElementById("cartTotal");

if(!list)return;

list.innerHTML="";

if(cart.length===0){
list.innerHTML="<p>🛒 कार्ट खाली है।</p>";
}else{

cart.forEach((item,index)=>{

const div=document.createElement("div");
div.className="panel-item";

const name=document.createElement("div");
name.className="panel-item-name";
name.textContent=
(index+1)+". "+item.name;

const price=document.createElement("div");
price.className="panel-item-price";

const itemTotal=
(Number(item.price)||0)*
(Number(item.qty)||0);

price.textContent=
"₹"+item.price+
" × "+item.qty+
" = ₹"+itemTotal;

const actions=document.createElement("div");
actions.className="panel-actions";

const minus=document.createElement("button");
minus.className="qty-btn";
minus.textContent="−";
minus.onclick=function(){
decreaseQty(index);
};

const qty=document.createElement("b");
qty.textContent=item.qty;

const plus=document.createElement("button");
plus.className="qty-btn";
plus.textContent="+";
plus.onclick=function(){
increaseQty(index);
};

const remove=document.createElement("button");
remove.className="remove-btn";
remove.textContent="हटाएं";
remove.onclick=function(){
removeCart(index);
};

actions.appendChild(minus);
actions.appendChild(qty);
actions.appendChild(plus);
actions.appendChild(remove);

div.appendChild(name);
div.appendChild(price);
div.appendChild(actions);

list.appendChild(div);

});
}

if(total){
total.textContent=calculateCartTotal();
}
}

/* =========================
   WISHLIST
========================= */

function toggleWishlist(
productName,
productPrice,
productCategory
){

const index=wishlist.findIndex(item=>
item.name===productName&&
Number(item.price)===Number(productPrice)&&
item.category===productCategory
);

if(index>=0){

wishlist.splice(index,1);

}else{

wishlist.push({
name:String(productName),
price:Number(productPrice)||0,
category:String(productCategory)
});

}

saveWishlist();
renderProducts();
renderWishlist();
}

function saveWishlist(){
safeSetStorage("product_wishlist",wishlist);
updateCounts();
}

" ".repeat(

);

(Number(item.qty)||0);

padRight(item.name,nameWidth)+
padRight("₹"+item.price,rateWidth)+
padRight(item.qty,qtyWidth)+

encodeURIComponent(message);

document.getElementById("wishlistPanel").style.display="none";
document.getElementById("cartPanel").style.display="none";
document.getElementById("productFilters").style.display="block";

renderProducts();
goTop();
}

/* =========================
   TOP
========================= */

function goTop(){
window.scrollTo({
top:0,
behavior:"smooth"
});
}

/* =========================
   INITIALIZATION
========================= */

function initializeApp(){

try{

createCategoryList();
updateCounts();
renderProducts();

const errorBox=
document.getElementById("errorBox");

if(errorBox){
errorBox.style.display="none";
}

}catch(error){

console.error("App initialization error:",error);

const errorBox=
document.getElementById("errorBox");

if(errorBox){
errorBox.style.display="block";
}

}

}

/* =========================
   START
========================= */

if(document.readyState==="loading"){
document.addEventListener(
"DOMContentLoaded",
initializeApp
);
}else{
initializeApp();
}

</script>

</body>
</html>
